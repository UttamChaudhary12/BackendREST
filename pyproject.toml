[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-rag-backend"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.18,<1", "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1",
  "redis>=5.2,<7", "qdrant-client>=1.12,<2", "openai>=1.60,<3",
  "pypdf>=5,<7", "tzdata>=2024.1", "fastembed>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
